const steps = EXEC.mainSteps;
const maxOffset = Math.max(...steps.map(s => s.offset_ms + s.ms), 1);
document.getElementById('execId').textContent = EXEC.execution.id;
const a = document.getElementById('wfLink'); a.href = EXEC.workflow.url; a.textContent = EXEC.workflow.name;
document.getElementById('stats').innerHTML = [
  ['#'+EXEC.execution.id,'Execution'],
  [(EXEC.execution.durationMs/1000).toFixed(1)+' s','Duração'],
  [steps.filter(s=>s.status==='success').length+'/'+steps.length,'Steps ok'],
  [EXEC.execution.mode,'Mode']
].map(([v,l])=>`<div class="stat"><b>${v}</b><span class="muted">${l}</span></div>`).join('');

let selected = 'Route by Autonomous Intent';
let playIdx = 0, playing = false, timer;

function fmt(ms){ return ms<1000 ? ms+' ms' : (ms/1000).toFixed(1)+' s'; }
function render(){
  document.getElementById('timeline').innerHTML = steps.map((s,i)=>{
    const active = s.name===selected;
    const left = Math.round((s.offset_ms/maxOffset)*100);
    const w = Math.max(4, Math.round(((s.ms||1)/maxOffset)*100));
    return `<div class="step ${active?'active':''}" data-i="${i}"><div style="display:flex;justify-content:space-between;gap:8px"><div><span class="muted">${String(s.index).padStart(2,'0')}</span> <span class="pill">${s.status}</span> <strong>${s.name}</strong></div><span class="muted">${fmt(s.ms)}</span></div><div class="barwrap"><div class="bar" style="left:${left}%;width:${w}%"></div></div>${s.note?`<div class="muted" style="margin-top:4px;font-size:12px">${s.note}</div>`:''}</div>`;
  }).join('');
  document.querySelectorAll('.step').forEach(el=>el.onclick=()=>{ selected=steps[+el.dataset.i].name; playing=false; clearTimeout(timer); render(); });
  const st = EXEC.nodeStatus[selected]||{};
  const runs = EXEC.steps.filter(s=>s.name===selected);
  const preview = EXEC.previews[selected];
  document.getElementById('detail').innerHTML = `<h3 style="margin-top:0">${selected}</h3>
    <div class="muted">${st.note||''}</div>
    <p><b>${fmt(st.ms||0)}</b> · ${runs.length} run(s) · ordem ${st.index ?? '—'}</p>
    <pre>${preview?JSON.stringify(preview,null,2):'(sem amostra de saída)'}</pre>`;
  document.getElementById('playStatus').textContent = playing ? `Step ${playIdx+1}/${steps.length}` : '';
}
document.getElementById('play').onclick=()=>{
  if(playing){ playing=false; clearTimeout(timer); render(); return; }
  playing=true; playIdx=0; selected=steps[0].name; render();
  const tick=()=>{ if(!playing) return; if(playIdx>=steps.length-1){ playing=false; render(); return; } playIdx++; selected=steps[playIdx].name; render(); timer=setTimeout(tick,450); };
  timer=setTimeout(tick,450);
};
render();
